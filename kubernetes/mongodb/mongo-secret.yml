# Versi API untuk objek Secret, menggunakan API versi 1
apiVersion: v1

# Jenis objek yang akan dibuat, dalam hal ini adalah "Secret"
kind: Secret

# Metadata untuk objek Secret, termasuk nama objeknya
metadata:
  name: mongo-secret # Nama Secret

# Data rahasia yang akan disimpan dalam Secret
data:
  # Base64-encoded username untuk MongoDB
  MONGO_ROOT_USERNAME: YWRtaW4=

  # Base64-encoded password untuk MongoDB
  MONGO_ROOT_PASSWORD: c3VwZXJzZWNyZXRwYXNzd29yZA==
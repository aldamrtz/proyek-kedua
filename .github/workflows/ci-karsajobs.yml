name: CI for karsajobs

on:
  push:
    branches:
      - karsajobs

env:
  GHCR_PAT: ${{ secrets.GHCR_PAT }}

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install hadolint
        run: |
          wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.7.0/hadolint-Linux-x86_64
          sudo install /tmp/hadolint /usr/local/bin/hadolint

      - name: Lint Dockerfile
        run: hadolint karsajobs/Dockerfile

  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.15"

      - name: Install Dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, test-app]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        run: echo $GHCR_PAT | docker login ghcr.io -u aldamrtz --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t aldaaa/karsajobs:latest -f karsajobs/Dockerfile karsajobs
          docker tag aldaaa/karsajobs:latest ghcr.io/aldamrtz/a433-microservices/karsajobs:latest
          docker push ghcr.io/aldamrtz/a433-microservices/karsajobs:latest
